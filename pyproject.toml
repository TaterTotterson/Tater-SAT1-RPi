[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tater-sat1-standalone"
version = "0.1.0.dev0"
description = "Build embedded Tater and satellite-only voice appliances for Satellite1 Raspberry Pi hardware"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
authors = [{name = "TaterTotterson"}]
dependencies = [
  "spidev>=3.6,<4; sys_platform == 'linux'",
  "websockets>=12,<16",
  "rpi-ws281x>=5.0.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
tater-sat1-standalone = "tater_sat1_standalone.cli:main"
tater-sat1-provisioning = "tater_sat1_standalone.setup_portal:main"
tater-sat1-voice = "tater_sat1_standalone.voice:main"
tater-sat1-leds = "tater_sat1_standalone.leds:main"
tater-sat1-app-update = "tater_sat1_standalone.tater_app_update:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
