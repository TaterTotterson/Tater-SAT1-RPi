name: Raspberry Pi images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.flavor }} image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - standalone
          - satellite

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Unit tests
        run: ./script/test

      - name: Build ready-to-flash image
        env:
          PI_IMAGE_FLAVOR: ${{ matrix.flavor }}
          PI_IMAGE_NAME: tater-sat1-${{ matrix.flavor }}-${{ github.ref_name }}
          PI_RELEASE_VERSION: ${{ github.ref_name }}
          PI_FIRST_USER_NAME: tater
          PI_FIRST_USER_PASS: tater
          PI_ENABLE_SSH: "0"
          TATER_SAT1_OTA_PRIVATE_KEY_PEM: ${{ secrets.TATER_SAT1_OTA_PRIVATE_KEY_PEM }}
        run: ./scripts/build-pi-image.sh --flavor "${PI_IMAGE_FLAVOR}"

      - name: Collect image and checksum
        env:
          IMAGE_FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          mkdir -p out/image
          cp .cache/pi-gen-bookworm-arm64/deploy/image_*.img.xz out/image/
          cp .cache/pi-gen-bookworm-arm64/deploy/tater-sat1-${IMAGE_FLAVOR}-*-ota.sat1 out/image/
          cp .cache/pi-gen-bookworm-arm64/deploy/*.info out/image/ 2>/dev/null || true
          cd out/image
          sha256sum image_*.img.xz tater-sat1-*-ota.sat1 > "SHA256SUMS-${IMAGE_FLAVOR}.txt"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: tater-sat1-${{ matrix.flavor }}-image
          path: out/image/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish image release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Download both images
        uses: actions/download-artifact@v5.0.0
        with:
          pattern: tater-sat1-*-image
          path: out/release
          merge-multiple: true

      - name: Build Tater OTA feed
        run: |
          python3 script/build_release_manifest.py \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --release-dir out/release

      - name: Find previous published release
        id: previous_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=""
          if resolved_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name // empty' 2>/dev/null)"; then
            previous_tag="${resolved_tag}"
          fi
          printf 'tag=%s\n' "${previous_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build release notes
        run: |
          python3 script/build_release_notes.py \
            --tag "${GITHUB_REF_NAME}" \
            --previous-tag "${{ steps.previous_release.outputs.tag }}" \
            --output out/release/RELEASE_NOTES.md

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          body_path: out/release/RELEASE_NOTES.md
          files: |
            out/release/*.img.xz
            out/release/*.sat1
            out/release/latest.json
            out/release/*-manifest.json
            out/release/*.info
            out/release/SHA256SUMS-*.txt
