name: Raspberry Pi image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Unit tests
        run: ./script/test

      - name: Build ready-to-flash image
        env:
          PI_IMAGE_NAME: tater-sat1-${{ github.ref_name }}
          PI_FIRST_USER_NAME: tater
          PI_FIRST_USER_PASS: tater
        run: ./scripts/build-pi-image.sh

      - name: Collect image and checksum
        run: |
          set -euo pipefail
          mkdir -p out/image
          cp .cache/pi-gen-bookworm-arm64/deploy/image_*.img.xz out/image/
          cp .cache/pi-gen-bookworm-arm64/deploy/*.info out/image/ 2>/dev/null || true
          cd out/image
          sha256sum image_*.img.xz > SHA256SUMS.txt

      - name: Upload image artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: tater-sat1-image
          path: out/image/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/image/*.img.xz
            out/image/*.info
            out/image/SHA256SUMS.txt
          body: |
            Ready-to-flash Tater SAT1 standalone Raspberry Pi image.

            Flash the `.img.xz` with Raspberry Pi Imager, customize Wi-Fi and
            login settings, attach the Satellite1 HAT, and boot. Tater is at
            `http://tater-sat1.local:8501` after startup.
